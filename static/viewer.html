<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Bid Document Analysis Viewer</title>
  <style>
    body { font-family: -apple-system, sans-serif; margin: 20px; background: #f5f5f5; }
    .finding { background: white; border: 1px solid #ddd; border-radius: 8px; padding: 16px; margin-bottom: 16px; }
    .finding h3 { margin-top: 0; }
    .confidence { color: #666; font-size: 0.9em; }
    .evidence { background: #fffbe6; padding: 8px; border-left: 3px solid #f0c000; margin: 8px 0; font-style: italic; }
    .page-view { position: relative; display: inline-block; margin-top: 12px; }
    .page-view img { display: block; max-width: 700px; }
    .highlight-box { position: absolute; border: 3px solid red; background: rgba(255,0,0,0.15); pointer-events: none; }
    input, button { padding: 8px; margin-right: 8px; }
    #controls { margin-bottom: 20px; }
  </style>
</head>
<body>
  <h1>Bid Document Analysis Viewer</h1>

  <div id="controls">
    <input id="projectId" placeholder="Project ID" size="40">
    <input id="taskId" placeholder="Task ID" size="40">
    <button onclick="loadResult()">Load Result</button>
  </div>

  <div id="output"></div>

  <script>
    async function loadResult() {
      const projectId = document.getElementById('projectId').value.trim();
      const taskId = document.getElementById('taskId').value.trim();
      const output = document.getElementById('output');
      output.innerHTML = 'Loading...';

      try {
        const res = await fetch('/projects/' + projectId + '/tasks/' + taskId + '/result');
        if (!res.ok) {
          output.innerHTML = 'Error: ' + res.status + ' ' + (await res.text());
          return;
        }
        const data = await res.json();
        output.innerHTML = '<p><strong>Model:</strong> ' + data.model_used + ' | <strong>Skill version:</strong> ' + data.skill_version + '</p>';

        for (const f of data.findings) {
          const div = document.createElement('div');
          div.className = 'finding';
          div.innerHTML =
            '<h3>' + f.title + '</h3>' +
            '<p class="confidence">Confidence: ' + f.confidence + ' | Page ' + f.page_number + '</p>' +
            '<p>' + f.risk_explanation + '</p>' +
            '<p><strong>Recommended action:</strong> ' + f.recommended_action + '</p>' +
            '<div class="evidence">"' + f.evidence_quote + '"</div>' +
            '<div class="page-view"></div>';
          output.appendChild(div);

          const pageViewDiv = div.querySelector('.page-view');
          renderPageWithHighlight(projectId, f.document_id, f.page_number, f.highlight_bbox, pageViewDiv);
        }
      } catch (e) {
        output.innerHTML = 'Error: ' + e;
      }
    }

    function renderPageWithHighlight(projectId, documentId, pageNumber, bbox, container) {
      const img = document.createElement('img');
      img.src = '/projects/' + projectId + '/documents/' + documentId + '/pages/' + pageNumber + '/image';

      img.onload = function() {
        const scale = 150 / 72;
        const box = document.createElement('div');
        box.className = 'highlight-box';
        box.style.left = (bbox.x0 * scale * (img.clientWidth / img.naturalWidth)) + 'px';
        box.style.top = (bbox.y0 * scale * (img.clientHeight / img.naturalHeight)) + 'px';
        box.style.width = ((bbox.x1 - bbox.x0) * scale * (img.clientWidth / img.naturalWidth)) + 'px';
        box.style.height = ((bbox.y1 - bbox.y0) * scale * (img.clientHeight / img.naturalHeight)) + 'px';
        container.appendChild(box);
      };

      container.appendChild(img);
    }
  </script>
</body>
</html>
