services:
  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
    volumes:
      - ./app:/app/app
      - ./scripts:/app/scripts
      - ./data:/app/data
      - ./static:/app/static
      - uploads:/app/data/uploads
    env_file: .env
    depends_on:
      - db

  worker:
    build: .
    command: python -m app.worker
    volumes:
      - ./app:/app/app
      - ./scripts:/app/scripts
      - ./data:/app/data
      - ./static:/app/static
      - uploads:/app/data/uploads
    env_file: .env
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bidharness
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: bidharness
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  # frontend:
  #   build: ./frontend
  #   ports:
  #     - "5173:5173"
  #   volumes:
  #     - ./frontend:/app
  #     - /app/node_modules

volumes:
  pgdata:
  uploads:
